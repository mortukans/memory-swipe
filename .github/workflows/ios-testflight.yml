name: iOS → TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Apple (GitHub secrets). The distribution cert is per-account, so these can be
      # the SAME secret values used by the other app; only the ASC app record + bundle
      # id (com.mortukans.memoryswipe) must be created once in App Store Connect.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      DIST_CERT_ID: ${{ secrets.DIST_CERT_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode (SDK 57 needs Xcode 26.1/26.2)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && { echo "No Xcode 26.x on this runner"; exit 1; }
          sudo xcode-select -s "$X" && xcodebuild -version

      - name: Install JS deps
        run: npm ci

      - name: Typecheck + tests
        run: npm run typecheck && npm test

      - name: Generate native iOS project (Continuous Native Generation)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Patch Podfile (expo/expo#50470 workaround)
        run: ruby tools/ci/patch-podfile.rb

      - name: Show generated privacy manifest, deployment target and purpose strings
        run: |
          echo "--- Podfile.properties.json"; cat ios/Podfile.properties.json || true
          echo "--- PrivacyInfo.xcprivacy"; cat ios/MemorySwipe/PrivacyInfo.xcprivacy || echo "(none at app level)"
          echo "--- Info.plist usage strings"; grep -A1 "UsageDescription" ios/MemorySwipe/Info.plist || true
          echo "--- lv InfoPlist.strings"; cat ios/MemorySwipe/Supporting/lv.lproj/InfoPlist.strings 2>/dev/null || find ios -name "InfoPlist.strings" -exec sh -c 'echo {}; cat {}' \; || true

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Build + upload to TestFlight
        run: |
          gem install fastlane --no-document -q
          fastlane ios beta

      - name: Keep IPA + logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
